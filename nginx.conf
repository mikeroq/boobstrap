server {
  listen 3000 default_server;
  listen [::]:3000 default_server;
  server_name _;
  absolute_redirect off;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  charset utf-8;

  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
  }

  location = /docs.html { return 308 /docs; }
  location = /docs/ { return 308 /docs; }
  location = /docs/index.html { return 308 /docs; }

  location = /docs {
    try_files /docs/index.html =404;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
  }

  location ~ ^(/docs/(?:getting-started/(?:introduction|installation|starter-template|theming)|foundations/(?:typography|layout|responsive-composition)|components/(?:navbar|badges|cards|alerts|banners|forms(?:/(?:inputs|input-groups|selects|searchable-select|date-time|passwords-masks|checks-radios|otp))?|code-windows|icons)|interactivity/(?:overview|collapse|dropdown|tabs)|reference/(?:utilities|tokens|classes|accessibility)))/$ { return 308 $1; }

  location ~ ^/docs/(?:getting-started/(?:introduction|installation|starter-template|theming)|foundations/(?:typography|layout|responsive-composition)|components/(?:navbar|badges|cards|alerts|banners|forms(?:/(?:inputs|input-groups|selects|searchable-select|date-time|passwords-masks|checks-radios|otp))?|code-windows|icons)|interactivity/(?:overview|collapse|dropdown|tabs)|reference/(?:utilities|tokens|classes|accessibility))$ {
    try_files /docs/index.html =404;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
  }

  location = /docs/components/buttons/ { return 308 /docs/components/buttons; }
  location = /docs/components/buttons/index.html { return 308 /docs/components/buttons; }

  location = /docs/components/buttons {
    try_files /docs/components/buttons/index.html =404;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
  }

  location = /playground.html { return 308 /playground; }
  location = /playground/ { return 308 /playground; }
  location = /playground/index.html { return 308 /playground; }

  location = /playground {
    try_files /playground/index.html =404;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
  }

  location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }
}
