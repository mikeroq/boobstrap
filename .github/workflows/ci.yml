name: CI

on:
  workflow_dispatch:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

jobs:
  smoke:
    name: Site smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install site dependencies
        run: npm ci
      - name: Install framework dev branch
        if: github.ref == 'refs/heads/dev' || github.base_ref == 'dev'
        run: npm run framework:dev
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run smoke suite
        run: npm test

  production-image:
    name: Production image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build production container
        run: docker build --tag boobstrap-site:test .
      - name: Verify generated social card
        shell: bash
        run: |
          docker run --detach --name boobstrap-site-test --publish 127.0.0.1:3000:3000 boobstrap-site:test
          trap 'docker rm --force boobstrap-site-test >/dev/null' EXIT
          for attempt in {1..10}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3000/og/docs/components/drawers.png; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error --head http://127.0.0.1:3000/og/docs/components/drawers.png \
            | grep --ignore-case --quiet '^cache-control: public, max-age=300, must-revalidate'
