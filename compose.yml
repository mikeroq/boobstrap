services:
  boobstrap:
    image: boobstrap:local
    build:
      context: .
      target: runtime
    init: true
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.docker.network: nashboard
      traefik.http.routers.boobstrap-org.rule: "Host(`boobstrap.org`) || Host(`www.boobstrap.org`)"
      traefik.http.routers.boobstrap-org.entrypoints: https
      traefik.http.routers.boobstrap-org.tls.certresolver: letsencrypt
      traefik.http.routers.boobstrap-org.service: boobstrap-org
      traefik.http.services.boobstrap-org.loadbalancer.server.port: "3000"
      traefik.http.routers.boobstrap-org-http.rule: "Host(`boobstrap.org`) || Host(`www.boobstrap.org`)"
      traefik.http.routers.boobstrap-org-http.entrypoints: http
      traefik.http.routers.boobstrap-org-http.middlewares: "redirect-to-https@file"
    ports:
      - "${PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
